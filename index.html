<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente de Busca de Artigos Científicos</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div id="history" class="card history-card">
        <h3>Histórico de pesquisas</h3>
        <p class="history-empty">As últimas ideias inseridas aparecerão aqui.</p>
        <ul id="historyList" class="history-list"></ul>
      </div>
      <div id="selectedCart" class="card cart-card" style="display: none;">
        <h3>Artigos Selecionados (<span id="cartCount">0</span>)</h3>
        <button id="btnNextPage" class="btn-primary">Avançar para Aula ➡️</button>
      </div>
    </aside>

    <main class="main-content" id="mainSearch">
      <h1 class="card">Assistente de Busca de Artigos</h1>
      <div class="card">
        <textarea id="lessonInput" placeholder="Descreva o tema da aula (ex.: Ciência de Dados no cotidiano)..."></textarea>
        <button id="searchBtn">🔍 Buscar Artigos</button>
      </div>
      <div id="results" class="card" style="min-height: 200px;"></div>
    </main>

    <main class="main-content" id="mainSelected" style="display: none;">
      <h1 class="card">Material da Aula</h1>
      <button id="btnBackSearch" class="btn-secondary">⬅️ Voltar para Busca</button>
      <div id="selectedResults" class="card"></div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
