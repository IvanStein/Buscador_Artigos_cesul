<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente de Busca de Artigos Científicos</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div id="history" class="card history-card">
        <h3>Histórico de pesquisas</h3>
        <p class="history-empty">As últimas ideias inseridas aparecerão aqui.</p>
        <ul id="historyList" class="history-list"></ul>
      </div>
      <div id="selectedCart" class="card cart-card" style="display: none;">
        <h3>Artigos Selecionados (<span id="cartCount">0</span>)</h3>
        <button id="btnNextPage" class="btn-primary">Avançar para Aula ➡️</button>
      </div>

      <div class="card settings-card">
        <button id="btnSettings" class="btn-secondary" style="width:100%; border:none; padding:0.8rem; background:hsla(0,0%,100%,0.05); color:#fff; display:flex; align-items:center; gap:0.5rem; justify-content:center;">
          ⚙️ Configurações
        </button>
      </div>
    </aside>

    <main class="main-content" id="mainSearch">
      <h1 class="card">Assistente de Busca de Artigos</h1>
      <div class="card">
        <textarea id="lessonInput" placeholder="Descreva o tema da aula (ex.: Ciência de Dados no cotidiano)..."></textarea>
        <div class="quick-suggestions">
          <span class="suggestion-label">Sugestões rápidas:</span>
          <button type="button" class="suggestion-btn" data-value="Ciência de Dados no cotidiano">📊 Ciência de Dados</button>
          <button type="button" class="suggestion-btn" data-value="Inteligência Artificial na Educação">🤖 IA na Educação</button>
          <button type="button" class="suggestion-btn" data-value="Mudanças Climáticas e Sustentabilidade">🌍 Mudanças Climáticas</button>
          <button type="button" class="suggestion-btn" data-value="Metodologias Ativas de Aprendizagem">✏️ Metodologias Ativas</button>
        </div>
        <button id="searchBtn">🔍 Buscar Artigos</button>
      </div>
      <div id="results" class="card" style="min-height: 200px;"></div>
    </main>

    <main class="main-content" id="mainSelected" style="display: none;">
      <div class="card header-card">
        <h1 style="margin: 0 0 1rem 0;">Material da Aula</h1>
        <div class="action-bar" style="border: none; margin: 0; padding: 0; justify-content: space-between; width: 100%; display: flex;">
          <button id="btnBackSearch" class="btn-secondary">⬅️ Voltar para Busca</button>
          <div style="display: flex; gap: 0.5rem;">
            <button id="btnCopyMarkdown" class="btn-select">📋 Copiar Markdown</button>
            <button id="btnPrintMaterial" class="btn-primary" style="margin: 0; width: auto;">🖨️ Imprimir Material</button>
          </div>
        </div>
      </div>
      <div id="selectedResults" class="card"></div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="card modal-content">
      <h2>Configurações do Sistema</h2>
      <div class="form-group">
        <label for="inputGroqKey">Chave da API Groq (Tradução/Tópicos)</label>
        <input type="password" id="inputGroqKey" placeholder="gsk_..." />
      </div>
      <div class="form-group">
        <label for="inputTelegramToken">Token do Telegram Bot (Opcional)</label>
        <input type="password" id="inputTelegramToken" placeholder="123456:ABC-DEF1234..." />
      </div>
      <div class="action-bar" style="justify-content: flex-end;">
        <button id="btnSaveSettings" class="btn-select selected">💾 Salvar Configurações</button>
        <button id="btnCloseSettings" class="btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
